# Stage deployment — pulls a pre-built image from Yandex Cloud Container
# Registry (cr.yandex). Build + push happens locally via
# `scripts/push-stage.sh`; Dokploy only pulls and runs.
#
# Dokploy:
#   - Map a domain to service `new-api` port 3000 (Traefik handles routing).
#   - Provide env via Dokploy UI or a `.env.stage` file:
#       NEW_API_IMAGE  (e.g. cr.yandex/<registry-id>/new-api:feat-foo-abc1234)
#       POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#       REDIS_PASSWORD, SESSION_SECRET,
#       GLOBAL_WEB_RATE_LIMIT_ENABLE, GLOBAL_API_RATE_LIMIT_ENABLE,
#       CRITICAL_RATE_LIMIT_ENABLE
#   - The Dokploy host must be authenticated to cr.yandex (either run
#     `yc container registry configure-docker`, or attach a service account
#     with role `container-registry.images.puller`).
#
# Local usage (after pushing an image):
#   NEW_API_IMAGE=cr.yandex/<id>/new-api:<tag> \
#     docker compose -f docker-compose.stage.yml --env-file .env.stage up -d
#
# Build + push current branch to cr.yandex:
#   YC_REGISTRY_ID=crpxxxxxxxxxxxx ./scripts/push-stage.sh
#
# Stop / reset:
#   docker compose -f docker-compose.stage.yml down
#   docker compose -f docker-compose.stage.yml down -v   # also wipes data

services:
  new-api:
    image: ${NEW_API_IMAGE:?NEW_API_IMAGE must be set, e.g. cr.yandex/<registry-id>/new-api:<tag>}
    pull_policy: always
    container_name: new-api-stage
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - stage_data:/data
      - stage_logs:/app/logs
    command: --log-dir /app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-stage}:${POSTGRES_PASSWORD:-stage}@postgres:5432/${POSTGRES_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-stage}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-change-me-stage}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-stage
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=${GLOBAL_WEB_RATE_LIMIT_ENABLE}
      - GLOBAL_API_RATE_LIMIT_ENABLE=${GLOBAL_API_RATE_LIMIT_ENABLE}
      - CRITICAL_RATE_LIMIT_ENABLE=${CRITICAL_RATE_LIMIT_ENABLE}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - stage-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: new-api-stage-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-stage}"]
    networks:
      - stage-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-stage-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - stage_pg_data:/var/lib/postgresql/data
    networks:
      - stage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stage} -d ${POSTGRES_DB:-new-api}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  stage_data:
  stage_logs:
  stage_pg_data:

networks:
  stage-network:
    driver: bridge
